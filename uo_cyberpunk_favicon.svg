<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#0a0a0a"/>

  <!-- Hex frame outer -->
  <polygon fill="none" stroke="#c8c8c8" stroke-width="1" points="16,2 28,9 28,23 16,30 4,23 4,9"/>

  <!-- Hex frame inner -->
  <polygon fill="none" stroke="#444" stroke-width="0.5" points="16,4 26,10 26,22 16,28 6,22 6,10"/>

  <!-- Outer reticle ring -->
  <circle fill="none" stroke="#aaa" stroke-width="1" cx="16" cy="16" r="6"/>

  <!-- Inner reticle ring -->
  <circle fill="none" stroke="#555" stroke-width="0.5" cx="16" cy="16" r="3.5"/>

  <!-- Center dot -->
  <circle fill="#ddd" cx="16" cy="16" r="1"/>

  <!-- Crosshair lines -->
  <line stroke="#999" stroke-width="0.75" x1="16" y1="7" x2="16" y2="12"/>
  <line stroke="#999" stroke-width="0.75" x1="16" y1="20" x2="16" y2="25"/>
  <line stroke="#999" stroke-width="0.75" x1="7" y1="16" x2="12" y2="16"/>
  <line stroke="#999" stroke-width="0.75" x1="20" y1="16" x2="25" y2="16"/>
</svg>
